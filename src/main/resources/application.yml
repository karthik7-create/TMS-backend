server:
  port: ${port:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    com.taskmanager: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

jwt:
  secret: dGFza21hbmFnZXJzZWNyZXRrZXlmb3Jqd3R0b2tlbnNpZ25pbmcyMDI2
  expiration: 86400000









